<div class="flex items-center justify-end gap-1">

    {% for action in actions %}
        {% if action.enabled %}

            <button
                type="button"
                {{ action.htmx }}
                {% if action.confirm %}
                    data-confirm="{{ action.confirm }}"
                {% endif %}
                class="{{ action.css_class|default:'btn btn-sm btn-ghost' }}"
                title="{{ action.label }}"
            >
                {% if action.icon %}
                    {{ action.icon }}
                {% endif %}

                <span class="sr-only">
                    {{ action.label }}
                </span>
            </button>

        {% endif %}
    {% endfor %}

</div>
