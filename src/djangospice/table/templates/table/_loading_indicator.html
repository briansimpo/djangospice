{% load i18n %}
    <!-- ====================================================== -->
    <!-- LOADING INDICATOR -->
    <!-- ====================================================== -->

    <div id="table-loading-{{ table_id }}" class="htmx-indicator pointer-events-none absolute inset-0 z-30 flex items-center justify-center bg-white/60 backdrop-blur-[1px]">

        <div class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3 shadow-lg">

            <svg class="h-5 w-5 animate-spin text-primary-600" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>

            <span class="text-sm font-medium text-slate-600">
                {% trans "Loading records..." %}
            </span>

        </div>

    </div>
