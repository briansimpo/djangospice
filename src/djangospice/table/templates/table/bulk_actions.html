{% if bulk_actions %}

<div
    x-show="selected.length > 0"
    x-cloak
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    class="sticky top-[41px] z-20 flex h-[52px] items-center justify-between gap-4 border-b border-indigo-100 bg-indigo-50 p-2 shadow-sm"
>
    <div class="flex items-center gap-2 pl-2">

        <div class="flex h-6 w-6 items-center justify-center rounded-full bg-indigo-100 text-xs font-bold text-indigo-700">
            <span x-text="selected.length"></span>
        </div>

        <span class="text-sm font-semibold tracking-wider text-slate-700">
            Selected
        </span>

    </div>


    <form
        method="post"
        action="{{ table_url }}"
        class="flex items-center gap-2"
        hx-indicator="#{{ table_id }}-loader"
        @htmx:confirm="handleConfirm"
    >

        {% csrf_token %}

        <template x-for="id in selected" :key="id">
            <input
                type="hidden"
                name="selected_ids"
                :value="id"
            >
        </template>


        <div class="relative">

            <select
                required
                name="action"
                x-ref="actionSelect"
                @change.stop
                class="h-9 appearance-none rounded-lg border border-slate-200 bg-slate-50 pl-3 pr-8 text-sm transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500"
            >
                <option value="" disabled selected>
                    Choose action
                </option>

                {% for action in bulk_actions %}
                    <option value="{{ action.name }}">
                        {{ action.label }}
                    </option>
                {% endfor %}
            </select>

            <div class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2">
                <svg
                    class="h-4 w-4 text-slate-400"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                >
                    <path
                        fill-rule="evenodd"
                        d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                        clip-rule="evenodd"
                    />
                </svg>
            </div>

        </div>


        <button
            type="submit"
            class="btn btn-sm btn-primary"
            :disabled="selected.length === 0"
        >
            Apply
        </button>

    </form>

</div>

{% endif %}
