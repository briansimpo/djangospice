{% load i18n %}
{% load django_tables2 %}

<div class="flex flex-wrap items-center gap-1">
    <span class="text-sm text-slate-600">
        Letter Filter:
    </span>
    <a
        hx-get="{{ table_url }}{% querystring_replace  alphabet_parameter="" %}"
        hx-target="{{ htmx_target }}"
        hx-swap="outerHTML"
        hx-push-url="false"
        class="px-2 py-1 text-xs font-medium rounded border {% if not current_letter %}bg-slate-900 text-white border-slate-900{% else %}bg-white text-slate-700 border-gray-300 hover:bg-gray-50{% endif %}"
    >
        All
    </a>

    <!-- A-Z Loop -->
    {% for letter in alphabet %}
        <a
            hx-get="{{ table_url }}{% querystring_replace  alphabet_parameter=letter %}"
            hx-target="{{ htmx_target }}"
            hx-swap="outerHTML"
            hx-push-url="false"
            
            class="px-2 py-1 text-xs font-medium rounded border {% if current_letter == letter %}bg-slate-900 text-white border-slate-900{% else %}bg-white text-slate-700 border-gray-300 hover:bg-gray-50{% endif %}"
        >
            {{ letter }}
        </a>
    {% endfor %}
</div>
