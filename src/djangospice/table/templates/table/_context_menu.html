{% load i18n %}
    <!-- ====================================================== -->
    <!-- CONTEXT MENU -->
    <!-- ====================================================== -->
    <div data-context-menu
        class="hidden fixed z-50 w-56 rounded-lg border border-slate-200 bg-white py-1 shadow-xl text-sm">
        <div class="px-3 py-2 border-b border-slate-100">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                {% trans "Actions" %}
            </p>
        </div>

        {% for action in row_actions %}
            <button
                type="button"
                hx-{{ action.method }}="{{ action.url }}?{{object_parameter}}=[{{object_parameter}}]"
                {% if action.confirm %}
                    hx-confirm="{{ action.confirm }}"
                {% endif %}
                {% if action.open_tab %}
                    target="_blank"
                {% endif %}
                class="w-full flex items-center gap-3 px-4 py-2.5
                    text-left transition-colors duration-150
                    {% if action.is_danger %}
                        text-red-600 hover:bg-red-50
                    {% else %}
                        text-slate-700 hover:bg-slate-50
                    {% endif %}">

                {% if action.icon %}
                    <span class="w-4 shrink-0 text-center
                        {% if action.is_danger %}
                            text-red-500
                        {% else %}
                            text-slate-400
                        {% endif %}">
                        <i class="{{ action.icon }}"></i>
                    </span>
                {% endif %}

                <span class="min-w-0 break-words">
                    {{ action.label }}
                </span>
            </button>
        {% endfor %}
    </div>
