<div
    class="flex flex-col gap-3 border-b border-slate-200
           bg-white p-3 sm:flex-row sm:items-center
           sm:justify-between"
>
    <div class="flex items-center gap-2">
        {% for action in table_actions %}
            {% if action.enabled %}
                <button
                    type="button"
                    {{ action.htmx }}
                    {% if action.confirm %}
                        hx-confirm="{{ action.confirm }}"
                    {% endif %}
                    class="{{ action.css_class|default:'btn btn-sm btn-primary' }}"
                    {% if action.description %}
                        title="{{ action.description }}"
                    {% endif %}
                >
                    {% if action.icon %}
                        {% include action.icon %}
                    {% endif %}

                    {{ action.label }}
                </button>
            {% endif %}
        {% endfor %}
    </div>

    <div class="flex items-center gap-2">

        {% if search_enabled %}
            {% include "djangospice/table/search.html" %}
        {% endif %}

        {% if filterset %}
            <button
                type="button"
                class="btn btn-sm btn-secondary"
                @click="filtersOpen = !filtersOpen"
            >
                Filters
            </button>
        {% endif %}

    </div>
</div>

{% if filterset %}
    {% include "djangospice/table/filters.html" %}
{% endif %}
