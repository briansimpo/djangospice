<div class="flex items-center space-x-4">
      
    <div 
        x-data="{ notificationOpen: false }" 
        @keydown.escape.window="notificationOpen = false" 
        @click.outside="notificationOpen = false" 
        class="relative"
      >
        
        <!-- Bell Button -->
        <button 
            @click="notificationOpen = !notificationOpen" 
            type="button" 
            class="relative p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
            :aria-expanded="notificationOpen"
            aria-haspopup="true"
        >

            <!-- Bell Icon -->
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>

            {% if unread_count > 0 %}
                <!-- Notification Badge Count -->
                <span class="absolute top-1 right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white">
                    {{unread_count}}
                </span>
            {% endif %}
            
            
        </button>

        <!-- Dropdown Menu -->
        <div 
            x-cloak
            x-show="notificationOpen"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="absolute right-0 top-full z-50 mt-2 w-80 sm:w-96 overflow-y-auto overscroll-contain rounded-xl border border-slate-200 bg-white shadow-xl shadow-slate-900/10"
            role="menu"
        >
            <!-- Dropdown Header -->
            <div class="px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <h3 class="text-sm font-semibold text-gray-900">Notifications</h3>
                    {% if unread_count > 0 %}
                        <span class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2 py-0.5 rounded-full">{{unread_count}} New</span>
                    {% endif %}
                </div>
                <button class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
                    Mark all as read
                </button>
            </div>

            <!-- Notification List (Scrollable) -->
            <div class="max-h-80 overflow-y-auto divide-y divide-gray-100">
            
                {% for notification in unread_list %}
                    <!-- Unread Item -->
                    <a href="#" class="flex px-4 py-3 bg-indigo-50/40 hover:bg-gray-100 transition-colors">
                        <div class="flex-shrink-0 mr-3">
                            <span class="inline-flex items-center justify-center h-8 w-8 rounded-full bg-blue-100 text-blue-600">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            </span>
                        </div>
                        <div class="w-full">
                            <p class="text-sm text-gray-800 font-medium">{{notification.verb}}</p>
                            <p class="text-xs text-gray-500 mt-0.5 truncate">{{notification.description}}</p>
                            <p class="text-[11px] text-gray-400 mt-1">{{notification.timespan}}</p>
                        </div>
                        <div class="flex-shrink-0 self-center ml-2">
                            <span class="h-2 w-2 bg-indigo-600 rounded-full inline-block"></span>
                        </div>
                    </a>
                {% endfor %}

            </div>

            <!-- Footer View All -->
            <div class="p-2 text-center">
                <a href="#" class="block w-full py-2 text-xs font-semibold text-indigo-600 hover:text-indigo-800 hover:bg-gray-50 rounded-md transition-colors">
                    View all notifications
                </a>
            </div>
        </div>
    </div>
</div>
